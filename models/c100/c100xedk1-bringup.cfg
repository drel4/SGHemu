# Experimental firmware-accepted identity tuple, NOT a confirmed C100 chip ID.
# Use only for RE with explicit diagnostic continuation for unknown MMIO.
name=SGH-C100 C100XEDK1 - experimental bring-up
rom=0x01000000,roms/C100XEDK1/C100XEDK1_1.bin,0x800000
rom=0x02000000,roms/C100XEDK1/C100XEDK1_2.bin,0x800000
alias=0x00000000,0x01000000,0x20
ram=0x00400000,0x003e0600
ram=0x00000020,0x00002f80
reset=0
audio=silent
display=128,128
# Classification routine 0x01122D9E accepts this combination as class 3.
identity16=0x00040294,0x4700
identity16=0x00040296,0
identity16=0x00040298,0x0202
identity16=0x00002ffa,0x0015

# Experimental cold-boot handoff state, inferred from DoStartupCheck.
# UART below retains the observed cold-handoff value.
# Flash IDs unconfirmed: erased ID placeholders; x16 command protocol observed in guest.
flash=0x01000000,0xffff,0xffff
flash=0x02000000,0xffff,0xffff
# Firmware sector table: bottom boot blocks in bank 0, top boot blocks in bank 1.
flash_geometry=0x01000000,0,0x10000,0x2000
flash_geometry=0x02000000,0x7f0000,0x10000,0x2000
lcd_s6b33=0x00c00000,0x00c80000,16
diagnostic=continue

# Diagnostic GSM-frame IRQ source in emulated nanoseconds; DSP timing remains provisional.
intc=0x00040100
# Service-mode serial path. Device 13 (check_for_factory_loopback) is the USART
# at 0x40200; its bytes move through the general DMA controller at 0x40420, so a
# service boot needs both. The cable field loops a transmitted byte straight back.
# Both are only brought up by an explicit service session (--service); an ordinary
# boot leaves the cable detached and the controller unmapped, unchanged.
sds_uart=0x00040200,1
clock=0x00040b00,3900000
clock_mode=0x0901,19500000,39000000
clock_mode=0x0b01,23400000,46800000
clock_mode=0x0c01,25350000,50700000
userfs=0x00678d88,0x0067805c,100,28
periodic_time_irq=26,4615385
# Firmware sequence divider quantum in nanoseconds (SetSpeed constant).
ma3=0x00200000,0x00800000,1157
sim=0x00040a80,0x00041300,0x00040520
sim_present=1
sim_card=sim/test-sim.cfg
# General DMA controller; listed after sim so it leaves the SIM DMA channel
# (0x40520, controller channel 4) to the SIM device that already owns it.
# Pacing: start_delay,byte_time in CPU cycles (0 = built-in default).
# Attached only in a service session (see --service).
sds_dma=0x00040420,8,256,128

# Disconnected charger GPIO input; keypad has its own matrix device.

identity16=0x0004028e,0x0004
# Observed serial pin interface; PMIC registers are provisional zero defaults.
pmic=0x00040300,0x90



# CX805 CPU IRQ delivery gate used by firmware critical sections.
register32=0x00040900,0
register32=0x00040904,0
irq_gate=0x00040902,0x80

# Persistent record-store window in the erased tail; snapshots are opt-in.
nvram=0x02500000,0x00300000
# First missing save: execute guest sector format + marker writer, save, cold reset.
nv_provision=0x01164698,0x0121cff6,0x01149c8e
# User-content import. At the version-query return PC the guest has loaded its
# storage table and UI records, so its own allocator (GSMMalloc), name search
# (flash_SearchByName) and file writer (flash_aWriteByName) can create a media
# entry the menus then list. Same spirit as nv_provision: every address is a
# verified XEDK1 entry, never a host-side substitute for guest storage.
import=0x0111aad8,0x011537ae,0x01164160,0x011642c0
# Native Jbed installer: idle entry, init globals, SetInitJar, UI message call,
# PRIM Java startup, minimum boot instructions (allow handset UI initialization).
java_import=0x01151010,0x0055a6f0,0x01126ba2,0x01146ad8,0x610,300000000

# Internal-ROM services decoded for selector 0x15. FFFF is an explicitly
# unknown version (displayed as FFF), not a fabricated successful self-test.
# Version HLE is restricted to UHGetIromVersion return PC 0x0111aad8.
irom_version=0x00081fe0,0xffff,0x0111aad8
irom_service=0x0008077c,memcpy

# CX805 active-low keypad matrix; firmware handles scanning and debounce.
keypad=0x00040800,8,4
# Host indices match native GUI order. Row/column indices are zero-based.
# Soft left/right; OK is a host convenience alias for soft left, not a new switch.
key=0,7,0
key=1,7,1
key=2,7,2
key=3,6,0
key=4,7,0
key=5,6,2
key=6,5,0
key=7,5,1
key=8,0,3
key=9,4,0
key=10,4,1
key=11,4,2
key=12,3,0
key=13,3,1
key=14,3,2
key=15,2,0
key=16,2,1
key=17,2,2
key=18,1,0
key=19,1,1
key=20,1,2
key=21,5,2

# CX805 RTC: binary counters, zero-based month/day; driver year origin verified in ROM.
rtc=0x00040080,1996
# Experimental battery HLE: idle, allocator, voltage report, charger detector,
# GPIO query and configured TA pin index. Firmware renders all resulting UI.
battery_guest=0x01151010,0x011537ae,0x011eae78,0x011eb8de,0x01145ac8,0x00406de9

# Firmware hardware-lock readback: bit 3 is written and polled by 01120450.
register32=0x0004140c,0

# DSP tone driver and RGB service-LED GPIO outputs, observed without HLE.
phone_io=0x012af30c,0x012af50e,0x014c6440,0x011465aa,5,3,6
