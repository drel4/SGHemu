# Experimental firmware-accepted identity tuple, NOT a confirmed C100 chip ID.
# Use only for RE with explicit diagnostic continuation for unknown MMIO.
name=SGH-C100 C100XEDA2 - experimental bring-up
rom=0x01000000,roms/C100XEDA2/C100XEDA2_1.bin,0x800000
rom=0x02000000,roms/C100XEDA2/C100XEDA2_2.bin,0x800000
alias=0x00000000,0x01000000,0x20
ram=0x00400000,0x003e05c0
ram=0x00000020,0x00002f80
reset=0
audio=silent
display=128,128
# Classification routine 0x01122D9E accepts this combination as class 3.
identity16=0x00040294,0x4700
identity16=0x00040296,0
identity16=0x00040298,0x0202
identity16=0x00002ffa,0x0015

# Experimental cold-boot handoff state, inferred from DoStartupCheck.
# UART below retains the observed cold-handoff value.
# Flash IDs unconfirmed: erased ID placeholders; x16 command protocol observed in guest.
flash=0x01000000,0xffff,0xffff
flash=0x02000000,0xffff,0xffff
flash_geometry=0x01000000,0,0x10000,0x2000
flash_geometry=0x02000000,0x7f0000,0x10000,0x2000
lcd_s6b33=0x00c00000,0x00c80000,16
diagnostic=continue

# Diagnostic GSM-frame IRQ source in emulated nanoseconds; DSP timing remains provisional.
intc=0x00040100
clock=0x00040b00,3900000
clock_mode=0x0901,19500000,39000000
clock_mode=0x0b01,23400000,46800000
clock_mode=0x0c01,25350000,50700000
userfs=0x00678d88,0x0067805c,100,28
periodic_time_irq=26,4615385
# Firmware sequence divider quantum in nanoseconds (SetSpeed constant).
ma3=0x00200000,0x00800000,1157
sim=0x00040a80,0x00041300,0x00040520
sim_present=1
sim_card=sim/test-sim.cfg

# Keypad input is active-low; no keys held during boot.


# Charger detect input (GPIO 0x4028e bit 2) inactive/high.
identity16=0x0004028e,0x0004

# Observed serial pins and PMIC address; register defaults are provisional zeros.
pmic=0x00040300,0x90



# CX805 CPU IRQ delivery gate used by firmware critical sections.
register32=0x00040900,0
register32=0x00040904,0
irq_gate=0x00040902,0x80

# Persistent record-store window in the erased tail; snapshots are opt-in.
nvram=0x02500000,0x00300000
# First missing save: execute guest sector format + marker writer, save, cold reset.
nv_provision=0x011645e4,0x0121c70e,0x01149bfa

# Internal-ROM services decoded for selector 0x15. FFFF is an explicitly
# unknown version (displayed as FFF), not a fabricated successful self-test.
# Version HLE is restricted to UHGetIromVersion return PC 0x0111aad8.
irom_version=0x00081fe0,0xffff,0x0111aad8
irom_service=0x0008077c,memcpy

# CX805 active-low keypad matrix; firmware handles scanning and debounce.
keypad=0x00040800,8,4
# Host indices match native GUI order. Row/column indices are zero-based.
# Soft left/right; OK is a host convenience alias for soft left, not a new switch.
key=0,7,0
key=1,7,1
key=2,7,2
key=3,6,0
key=4,7,0
key=5,6,2
key=6,5,0
key=7,5,1
key=8,0,3
key=9,4,0
key=10,4,1
key=11,4,2
key=12,3,0
key=13,3,1
key=14,3,2
key=15,2,0
key=16,2,1
key=17,2,2
key=18,1,0
key=19,1,1
key=20,1,2
key=21,5,2

# CX805 RTC: binary counters, zero-based month/day; driver year origin verified in ROM.
rtc=0x00040080,1996
