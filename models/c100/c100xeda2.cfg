# Relative paths are relative to the process working directory (repo root).
# Flash base is supported by absolute literals and the reset-vector zero alias.
name=Samsung SGH-C100 C100XEDA2
rom=0x01000000,roms/C100XEDA2/C100XEDA2_1.bin,0x800000
rom=0x02000000,roms/C100XEDA2/C100XEDA2_2.bin,0x800000
# Only the vector area is aliased: broader/remapped behavior is unverified.
alias=0x00000000,0x01000000,0x20
# RAM spans used by the bootstrap copy/BSS loops, NOT physical chip capacities.
ram=0x00400000,0x003e05c0
ram=0x00000020,0x00002f80
reset=0x00000000
# No guessed CPU frequency: one instruction = one scheduler tick initially.
audio=silent
display=128,128
